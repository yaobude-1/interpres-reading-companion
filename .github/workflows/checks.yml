name: checks

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.lock
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: |
          python -m compileall -q app.py rc assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint
        run: |
          ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Type check (incremental)
        run: |
          # Only the clean modules listed in mypy.ini's scope; add new files here.
          python -m mypy rc/netpolicy.py rc/textutil.py rc/lemma.py rc/fuzzy.py rc/screens.py rc/capture.py rc/hotkey.py rc/instance.py rc/gloss.py rc/htmldom.py rc/entrylayout.py rc/anim.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Core checks
        run: |
          python tests/run_checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression checks
        run: |
          $tests = @(
            "tests/test_chunking.py",
            "tests/test_p0_regressions.py",
            "tests/test_p1_regressions.py",
            "tests/test_panel_geometry.py",
            "tests/test_translation_ui.py",
            "tests/test_panel.py",
            "tests/test_ux_popup.py",
            "tests/test_popup_long.py",
            "tests/test_settings_smoke.py",
            "tests/test_appearance.py",
            "tests/test_selection_popup.py",
            "tests/test_prompt_plain.py",
            "tests/test_chat_context.py",
            "tests/test_uia_script.py",
            "tests/test_dictionary_redirect.py",
            "tests/test_entry_links.py",
            "tests/test_ux_scenarios.py",
            "tests/test_voice_preview.py",
            "tests/test_language_naming.py",
            "tests/test_vocab_word_card.py",
            "tests/test_vocab_sort.py",
            "tests/test_vocab_columns.py",
            "tests/test_except_hygiene.py",
            "tests/test_uia_contract.py",
            "tests/test_entryhtml_csp.py",
            "tests/test_anim.py",
            "tests/test_entry_anim.py",
            "tests/test_anim_windows.py",
            "tests/test_popup_resize.py"
          )
          foreach ($test in $tests) {
            Write-Host "==> $test"
            python $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # Guards against release drift: the portable package must actually build,
  # the exe version must match rc/__init__.py, and SHA256SUMS must be truthful.
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.lock
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Build portable package
        run: |
          $env:PYTHON = "python"
          powershell -ExecutionPolicy Bypass -File .\build_portable.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify artifacts
        run: |
          $ver = python -c "from rc import __version__; print(__version__)"
          $exe = "dist_portable\Interpres\Interpres.exe"
          if (-not (Test-Path $exe)) { Write-Host "missing exe"; exit 1 }
          $fv = (Get-Item $exe).VersionInfo.FileVersion
          if ($fv -ne $ver) { Write-Host "exe FileVersion '$fv' != __version__ '$ver'"; exit 1 }
          $zip = "dist\Interpres.zip"
          if (-not (Test-Path $zip)) { Write-Host "missing zip"; exit 1 }
          $sums = Get-Content "dist\SHA256SUMS.txt"
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if (-not ($sums -match [regex]::Escape($exeHash))) { Write-Host "exe hash mismatch"; exit 1 }
          if (-not ($sums -match [regex]::Escape($zipHash))) { Write-Host "zip hash mismatch"; exit 1 }
          Write-Host "build ok: version $ver, zip $([math]::Round((Get-Item $zip).Length/1MB,1)) MB"
