name: checks

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.lock
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app.py rc assets
      - name: Lint
        run: ruff check .
      - name: Core checks
        run: python tests/run_checks.py
      - name: Regression checks
        run: |
          python tests/test_chunking.py
          python tests/test_p0_regressions.py
          python tests/test_p1_regressions.py
          python tests/test_panel_geometry.py
          python tests/test_translation_ui.py
          python tests/test_panel.py
          python tests/test_ux_popup.py
          python tests/test_popup_long.py
          python tests/test_settings_smoke.py
          python tests/test_ux_scenarios.py
          python tests/test_voice_preview.py
