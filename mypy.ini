# Incremental type checking: only the modules explicitly listed on the command
# line are checked; legacy files are not chased. Goal is "new/changed files must
# pass", not annotating 20k lines at once.
#
# Usage:
#   python -m mypy rc/netpolicy.py rc/textutil.py ...
# or the "Type check (incremental)" step in .github/workflows/checks.yml.
#
# NOTE: keep this file ASCII-only. mypy opens it with the system locale on
# Windows, so non-ASCII comments can raise UnicodeDecodeError.

[mypy]
ignore_missing_imports = True
follow_imports = skip
cache_dir = .mypy_cache
